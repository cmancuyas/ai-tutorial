# pyproject.toml is like a .csproj file: it describes the project and its packages.
[project]
name = "ai-learning"
version = "0.1.0"
description = "Week 1: Python basics and a FastAPI survey API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",      # web framework, similar to ASP.NET Core Minimal APIs
    "uvicorn>=0.30",       # web server that runs FastAPI apps, similar to Kestrel
]

# Packages only needed while developing (like test projects in .NET)
[dependency-groups]
dev = [
    "pytest>=8",           # test runner, similar to xUnit
    "httpx>=0.27",         # HTTP client that FastAPI's TestClient needs
]

[tool.pytest.ini_options]
pythonpath = ["."]         # lets tests do "from app.main import app"
testpaths = ["tests"]
